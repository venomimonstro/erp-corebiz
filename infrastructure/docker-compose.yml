services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: corebiz
      POSTGRES_USER: corebiz
      POSTGRES_PASSWORD: corebiz
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - corebiz-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebiz -d corebiz"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  corebiz-postgres:
